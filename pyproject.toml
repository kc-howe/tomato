[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytomato"
version = "0.6.3"
description = "Topological Mode Analysis Tool for fast, persistent, density-based clustering."
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "numba>=0.53",
    "numpy>=1.20",
    "scipy>=1.6",
    "scikit-learn>=0.24",
    "pynndescent>=0.5",
    "matplotlib>=3.3",
]

license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/kc-howe/tomato"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]